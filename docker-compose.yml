# Runs the published backend image — no checkout or build needed, just this file and a .env
# beside it (copy backend/.env.example). Update with: docker compose pull && docker compose up -d
services:
  baskt:
    image: ghcr.io/pegoku/baskt-backend:latest
    # Pin a build instead of following main: ghcr.io/pegoku/baskt-backend:sha-<commit>
    env_file: .env
    environment:
      DATABASE_PATH: /data/baskt.db
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - baskt-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  baskt-data:

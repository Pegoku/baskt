name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          # The version code is the commit count, which needs the whole history.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The runner image ships the SDK; accepting the licences lets the Android Gradle plugin fetch the
      # exact platform and build tools the project asks for (compileSdk 37) on its own.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      # Releases are signed with the same debug key as local builds, so the phone takes them as in-place updates.
      # Without the secret (pull requests from forks) Gradle falls back to a throwaway key.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleOptimized --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: baskt-optimized-apk
          path: android/app/build/outputs/apk/optimized/app-optimized.apk
      - uses: actions/upload-artifact@v5
        with:
          name: baskt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Obtainium follows the GitHub releases: one per main build, tagged with the version the APK carries.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT: f1d017501417febbc0ee21647d233d333293bdab9ef6228e3f3a157cf6a14491
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/optimized/app-optimized.apk | grep -q "SHA-256 digest: $EXPECTED_CERT" \
            || { echo "APK is not signed with the release key; is DEBUG_KEYSTORE_BASE64 set?"; exit 1; }
          version="0.1.$(git rev-list --count HEAD)"
          cp app/build/outputs/apk/optimized/app-optimized.apk "baskt-$version.apk"
          gh release create "v$version" "baskt-$version.apk" --target "$GITHUB_SHA" --title "baskt $version" --notes "$(git log -1 --format=%s)"

name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          # The version code is the commit count, which needs the whole history.
          fetch-depth: 0
          # The runners are persistent, so keeping build/ and .gradle/ between jobs lets Kotlin compile
          # incrementally and Gradle reuse its configuration cache.
          clean: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The self-hosted runners have no Android SDK, so the command-line tools are installed once into the
      # runner's tool cache and reused. Accepting the licences lets the Android Gradle plugin fetch the exact
      # platform and build tools the project asks for (compileSdk 37) on its own.
      - name: Set up Android SDK
        env:
          # Pinned: newer command-line tools make "sdkmanager --licenses" a no-op, which leaves Gradle
          # unable to download the platform and build tools.
          CMDLINE_TOOLS_VERSION: "13114758"
        run: |
          sdk="${RUNNER_TOOL_CACHE:-$HOME/.cache}/android-sdk"
          tools="$sdk/cmdline-tools/$CMDLINE_TOOLS_VERSION"
          if [ ! -x "$tools/bin/sdkmanager" ]; then
            tmp="$RUNNER_TEMP/cmdline-tools"
            rm -rf "$tmp" && mkdir -p "$tmp" "$sdk/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -o "$tmp/tools.zip"
            python3 -m zipfile -e "$tmp/tools.zip" "$tmp"
            chmod +x "$tmp"/cmdline-tools/bin/*
            rm -rf "$tools" && mv "$tmp/cmdline-tools" "$tools"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$tools/bin/sdkmanager" --sdk_root="$sdk" --licenses > /dev/null || true
          test -f "$sdk/licenses/android-sdk-license" || { echo "Android SDK licences were not accepted"; exit 1; }
      # Releases are signed with the same debug key as local builds, so the phone takes them as in-place updates.
      # Without the secret (pull requests from forks) Gradle falls back to a throwaway key.
      # The key lives in the job's temp folder, which the runner wipes after every job, so it never
      # stays on disk where a later job (say, an approved fork PR) could read it.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          home="$RUNNER_TEMP/android-user-home"
          mkdir -p "$home"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > "$home/debug.keystore"
          fi
          echo "ANDROID_USER_HOME=$home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      # A Gradle daemon that outlives the job keeps its JIT-warmed JVM (and the Kotlin daemon) for the next
      # build. Clearing RUNNER_TRACKING_ID stops the runner from killing it as an orphan when the job ends.
      # Kept workspace plus warm daemon took a benchmarked build from about 230 s to about 120 s.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleOptimized
        env:
          RUNNER_TRACKING_ID: ""
      - uses: actions/upload-artifact@v5
        with:
          name: baskt-optimized-apk
          path: android/app/build/outputs/apk/optimized/app-optimized.apk
      - uses: actions/upload-artifact@v5
        with:
          name: baskt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Obtainium follows the GitHub releases: one per main build, tagged with the version the APK carries.
      - name: Prepare release
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_CERT: f1d017501417febbc0ee21647d233d333293bdab9ef6228e3f3a157cf6a14491
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/optimized/app-optimized.apk | grep -q "SHA-256 digest: $EXPECTED_CERT" \
            || { echo "APK is not signed with the release key; is DEBUG_KEYSTORE_BASE64 set?"; exit 1; }
          version="0.1.$(git rev-list --count HEAD)"
          cp app/build/outputs/apk/optimized/app-optimized.apk "$RUNNER_TEMP/baskt-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git log -1 --format=%s > "$RUNNER_TEMP/release-notes.txt"
      # The self-hosted runners have no gh CLI, so the release goes through an action instead.
      - name: Publish release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: baskt ${{ steps.release.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.txt
          files: ${{ runner.temp }}/baskt-${{ steps.release.outputs.version }}.apk
          fail_on_unmatched_files: true

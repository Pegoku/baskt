name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The runner image ships the SDK; accepting the licences lets the Android Gradle plugin fetch the
      # exact platform and build tools the project asks for (compileSdk 37) on its own.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: baskt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

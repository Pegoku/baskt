name: backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  # Every commit that passes the tests gets an image. Pull requests only build (a fork's token
  # cannot push to the registry); pushes publish sha-<commit>, the branch name, and on main latest.
  image:
    needs: test
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v5
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # "ci" is a long-lived buildx builder on the self-hosted runner machine. Its layer cache stays
          # on local disk between jobs, so there is no builder to boot and no cache to upload to GitHub.
          builder: ci
